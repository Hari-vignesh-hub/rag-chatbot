
services:
  chatbot:
    build: .
    image: ai-rag-chatbot:v1
    container_name: ai-rag-chatbot

    ports:
      - "8501:8501"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"

    volumes:
      - ./chroma_db:/app/chroma_db

    restart: unless-stopped
